name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format 18.1.8
        run: pip install clang-format==18.1.8

      - name: Check C++ formatting
        run: |
          clang-format --version
          ./scripts/format_check.sh

  tidy-check:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18 cmake
          sudo ln -sf /usr/bin/clang-tidy-18 /usr/local/bin/clang-tidy

      - name: Configure
        run: cmake -B build -DSKMEANS_COMPILE_TESTS=ON -DSKMEANS_COMPILE_EXAMPLES=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run clang-tidy
        run: |
          ln -s build/compile_commands.json compile_commands.json
          ./scripts/tidy_check.sh

  cpp-build-and-test:
    name: cpp-build-and-test (${{ matrix.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        name: [default, openmp-executor, serial-executor, blas-gemm]
        include:
          - name: openmp-executor
            cmake-args: -DSKMEANS_EXECUTOR=openmp
            packages: libomp-18-dev
          - name: serial-executor
            cmake-args: -DSKMEANS_EXECUTOR=serial
          - name: blas-gemm
            cmake-args: -DSKMEANS_GEMM=blas
            packages: libopenblas-dev
    env:
      CC: clang-18
      CXX: clang++-18
      # Every worker calls sgemm_ on its own mini-batch: keep the BLAS single-threaded
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ${{ matrix.packages }}

      - name: Configure
        run: cmake -B build -DSKMEANS_COMPILE_TESTS=ON -DSKMEANS_COMPILE_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }}

      - name: Build tests
        run: cmake --build build -j$(nproc) --target tests

      - name: Build examples
        run: cmake --build build -j$(nproc) --target examples

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  windows-msvc:
    name: windows-msvc (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: ARM64
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A ${{ matrix.arch }} -DSKMEANS_COMPILE_TESTS=ON -DSKMEANS_COMPILE_EXAMPLES=ON

      - name: Build tests
        run: cmake --build build --config Release --parallel --target tests

      - name: Build examples
        run: cmake --build build --config Release --parallel --target examples

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

  macos-accelerate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DSKMEANS_COMPILE_TESTS=ON -DSKMEANS_COMPILE_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build -j$(sysctl -n hw.ncpu) --target tests

      - name: Build examples
        run: cmake --build build -j$(sysctl -n hw.ncpu) --target examples

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 3.1.71

      - name: Configure
        run: emcmake cmake -B build -DSKMEANS_COMPILE_TESTS=ON -DSKMEANS_COMPILE_EXAMPLES=OFF -DSKMEANS_SKIP_FFTW=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build -j$(nproc) --target tests

      - name: Run tests (Node)
        run: ctest --test-dir build --output-on-failure

  python:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python bindings
        run: pip install ".[test]"

      - name: Run Python tests
        run: pytest python/tests/ -v

      - name: Run Python example
        run: python examples/simple_clustering.py 10000 128 50

  sanitizers-asan-ubsan:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake

      - name: Configure with ASan + UBSan
        run: |
          cmake -B build_asan -DSKMEANS_COMPILE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS_DEBUG="-g -O1" \
            -DCMAKE_C_FLAGS_DEBUG="-g -O1" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -D_GLIBCXX_SANITIZE_VECTOR=1" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build tests
        run: cmake --build build_asan -j$(nproc) --target tests

      - name: Run tests
        run: ctest --test-dir build_asan --output-on-failure

  sanitizers-tsan:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      TSAN_OPTIONS: ignore_noninstrumented_modules=1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake

      - name: Configure with TSan
        run: |
          cmake -B build_tsan -DSKMEANS_COMPILE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS_DEBUG="-g -O1" \
            -DCMAKE_C_FLAGS_DEBUG="-g -O1" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"

      - name: Build tests
        run: cmake --build build_tsan -j$(nproc) --target tests

      - name: Run tests
        run: ctest --test-dir build_tsan --output-on-failure

  fetchcontent:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake

      - name: Configure consumer project
        run: cmake -B build_fc tests/fetchcontent_test -DSUPERKMEANS_SOURCE_DIR=${{ github.workspace }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_fc -j$(nproc)

      - name: Run
        run: ./build_fc/fetchcontent_test

  ci-pass:
    # Gate job: require this single job in branch protection settings
    runs-on: ubuntu-latest
    if: always()
    needs:
      - format-check
      - tidy-check
      - cpp-build-and-test
      - windows-msvc
      - macos-accelerate
      - wasm
      - python
      - sanitizers-asan-ubsan
      - sanitizers-tsan
      - fetchcontent
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
